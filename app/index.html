/* Mise en page : une colonne étroite, beaucoup d'air, des surfaces sans bordure.
   Thème sombre unique. Une seule couleur d'accent, réservée à l'action principale
   et à l'onglet actif ; le vert et le rouge ne servent qu'aux bonnes et mauvaises réponses. */
:root {
  --bg: #0D0F13;
  --surface: #15181E;
  --surface-2: #1C2028;
  --surface-3: #262B35;
  --ink: #ECEEF2;
  --ink-2: #8D94A3;
  --line: #232832;
  --accent: #7AA2FF;
  --accent-ink: #0A1124;
  --accent-tint: #172238;
  --good: #4FD69A;
  --good-bg: #10261D;
  --bad: #FF7F7F;
  --bad-bg: #2B1618;
  --accent-2: #A6C0FF;
  --ink-fade: #AEB6C6;
  --surface-top: #1B1F27;
  --halo: #182445;
  --glow: rgba(122, 162, 255, .45);
  --hair: rgba(255, 255, 255, .07);
  --shine: rgba(255, 255, 255, .38);
  --shade: rgba(0, 0, 0, .75);
  --glass: rgba(24, 28, 36, .74);
  --f-disp: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  --f-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 32px;
}
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; min-width: 0; }

/* ---- En-tête ---- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; min-height: 46px; }
.brand-name { font-family: var(--f-disp); font-weight: 600; font-size: 21px; letter-spacing: -.02em; line-height: 1; margin: 0; }
.brand-name span { color: var(--ink-2); }

/* ---- Choix du véhicule ---- */
.veh { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface); border-radius: 999px; }
.veh-btn { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border: 0; background: transparent; color: var(--ink-2); border-radius: 999px; font-weight: 500; font-size: 14px; cursor: pointer; }
.veh-btn svg { width: 18px; height: 18px; }
.veh-btn[aria-pressed="true"] { background: var(--surface-3); color: var(--ink); }
.veh.wide { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 16px; padding: 4px; }
.veh.wide .veh-btn { justify-content: center; min-height: 48px; border-radius: 12px; font-size: 15px; }
.veh.wide .veh-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

/* ---- Onglets ---- */
.page-h { font-family: var(--f-disp); font-weight: 600; font-size: 34px; letter-spacing: -.03em; line-height: 1.05; margin: 8px 0 0; text-wrap: balance; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center;
  padding-top: 20px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, var(--bg) 62%, transparent); pointer-events: none; }
.tabs-in { pointer-events: auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; width: 100%; max-width: 560px; padding: 5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 58px; padding: 6px 1px; letter-spacing: -.01em; border: 0; background: transparent; color: var(--ink-2); border-radius: 17px; font-size: 13px; font-weight: 500; cursor: pointer; min-width: 0; }
.tab svg { width: 22px; height: 22px; flex: none; }
.tab span { max-width: 100%; white-space: nowrap; }
.tab[aria-current="page"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.tab-space { height: 84px; flex: none; }

/* ---- Examen ---- */
.exam { display: flex; flex-direction: column; gap: 18px; background: var(--surface); border-radius: 22px; padding: 22px; }
.kick { font-size: 12px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); margin: 0; }
.figs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fig { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fig b { font-family: var(--f-disp); font-size: 52px; font-weight: 600; letter-spacing: -.04em; line-height: .9; font-variant-numeric: tabular-nums; }
.fig span { font-size: 14px; line-height: 1.3; color: var(--ink-2); }
.chk { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 1.4; color: var(--ink-2); cursor: pointer; padding-top: 16px; border-top: 1px solid var(--line); }
.chk input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); flex: none; }
.chk b { color: var(--ink); font-weight: 500; }
.btn-go { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 14px; min-height: 54px; font-weight: 600; font-size: 16px; cursor: pointer; width: 100%; }
.exam-t { font-family: var(--f-disp); font-weight: 600; font-size: 40px; letter-spacing: -.04em; line-height: 1; margin: -6px 0 0; }
.exam-d { margin: 0; font-size: 15px; color: var(--ink-2); }
.exam-note { margin: 0; font-size: 14px; line-height: 1.45; color: var(--ink-2); padding-top: 16px; border-top: 1px solid var(--line); }
.exam-note b { color: var(--ink); font-weight: 500; }
.last { margin: 0; font-size: 14px; color: var(--ink-2); }
.last b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---- Cartes ---- */
.card { background: var(--surface); border-radius: 22px; padding: 22px; min-width: 0; }
.card h3, .sec-h { font-family: var(--f-disp); font-weight: 600; font-size: 17px; letter-spacing: -.01em; margin: 0 0 16px; line-height: 1.2; }
.sec-h { margin-bottom: 0; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 0; }
.stat { display: flex; flex-direction: column; gap: 6px; }
.stat dd { order: -1; }
.stat dt { font-size: 12px; line-height: 1.3; color: var(--ink-2); }
.stat dd { margin: 0; font-family: var(--f-disp); font-weight: 600; font-size: 30px; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.stat dd small { font-size: 15px; color: var(--ink-2); font-weight: 500; letter-spacing: 0; }

.plot-wrap { display: grid; grid-template-columns: 30px 1fr; margin-top: 26px; }
.axis { position: relative; }
.axis span { position: absolute; right: 8px; transform: translateY(50%); font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; line-height: 1; }
.plot { position: relative; height: 120px; border-bottom: 1px solid var(--line); }
.thr { position: absolute; left: 0; right: 0; bottom: 87.5%; border-top: 1px dashed var(--ink-2); opacity: .6; }
.cols { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 8px; padding: 0 4px; }
.col { flex: 1; max-width: 36px; height: 100%; position: relative; }
.b { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 6px 6px 0 0; background: var(--surface-3); }
.b.pass { background: var(--good); }
.bv { position: absolute; left: -4px; right: -4px; text-align: center; font-size: 12px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; transform: translateY(-100%); padding-bottom: 4px; }
.plot-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 0 16px; font-size: 14px; color: var(--ink-2); }
.plot-note { font-size: 12px; color: var(--ink-2); margin: 10px 0 0 30px; }

/* ---- Listes de séries ---- */
.list { padding: 0; overflow: hidden; }
.list-h { padding: 20px 22px 12px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto 14px; align-items: center; gap: 12px; width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px solid var(--line); padding: 14px 22px; min-height: 64px; cursor: pointer; }
.list > .row:first-child { border-top: 0; }
.row:disabled { cursor: default; }
.row:not(:disabled):hover { background: var(--surface-2); }
.row-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row-t { font-weight: 500; }
.row-s { font-size: 13px; color: var(--ink-2); }
.meter { width: 56px; height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.chev { color: var(--ink-2); font-size: 20px; line-height: 1; }
.pill { min-width: 30px; text-align: center; padding: 2px 10px; border-radius: 999px; background: var(--bad-bg); color: var(--bad); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.pill.off { background: var(--surface-2); color: var(--ink-2); }
.row-sub { margin: 0; padding: 18px 22px 8px; border-top: 1px solid var(--line); font-size: 12px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }

.foot { font-size: 13px; line-height: 1.5; color: var(--ink-2); margin: 0; }
.get-app { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 14px; margin: 18px 0 6px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,.03); }
.get-app-t { flex: 1 1 220px; margin: 0; font-size: 14px; line-height: 1.4; color: var(--ink-2); }
.get-app-t b { display: block; color: var(--ink); font-size: 15px; font-weight: 600; }
.play-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 12px; background: #000; color: #fff; border: 1px solid rgba(255,255,255,.25); font: 600 14px/1 inherit; text-decoration: none; white-space: nowrap; }
.play-btn svg { width: 18px; height: 18px; }
.play-btn.soon { opacity: .7; cursor: default; }

/* ---- Question ---- */
.qtop { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
.link { background: none; border: 0; color: var(--ink-2); font-weight: 500; font-size: 15px; min-height: 44px; padding: 0; cursor: pointer; text-align: left; }
.qlab { font-size: 13px; color: var(--ink-2); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qcount { font-family: var(--f-disp); font-weight: 600; font-size: 22px; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.qcount small { font-size: 14px; color: var(--ink-2); font-weight: 500; }
.segs { display: flex; gap: 3px; margin-top: -8px; }
.segs.dense { gap: 1px; }
.seg { flex: 1; min-width: 0; height: 3px; border-radius: 2px; background: var(--surface-3); }
.seg.done { background: var(--ink-2); }
.seg.cur { background: var(--accent); }
.seg.ok { background: var(--good); }
.seg.ko { background: var(--bad); }
.clock { display: flex; align-items: center; gap: 12px; }
.clock-bar { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
.clock-bar i { display: block; height: 100%; background: var(--ink); transition: width .25s linear; }
.clock-bar i.low { background: var(--bad); }
#tnum { font-family: var(--f-disp); font-weight: 600; font-size: 18px; min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
.stem { font-family: var(--f-disp); font-size: 22px; line-height: 1.3; letter-spacing: -.015em; font-weight: 600; margin: 0; text-wrap: balance; }
.stem:focus { outline: none; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left; min-height: 58px; padding: 15px 16px; border: 1.5px solid transparent; background: var(--surface); color: var(--ink); border-radius: 16px; font-size: 16px; line-height: 1.4; cursor: pointer; }
.opt .chip { flex: none; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: var(--surface-3); color: var(--ink-2); font-family: var(--f-disp); font-weight: 600; font-size: 13px; line-height: 1; }
.opt .otext { min-width: 0; padding-top: 2px; }
.opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-tint); }
.opt[aria-checked="true"] .chip { background: var(--accent); color: var(--accent-ink); }
.opt:disabled { cursor: default; color: var(--ink); opacity: 1; }
.opt.ok { border-color: var(--good); background: var(--good-bg); }
.opt.ok .chip { background: var(--good); color: var(--bg); }
.opt.ko { border-color: var(--bad); background: var(--bad-bg); }
.opt.ko .chip { background: var(--bad); color: var(--bg); }
.fb { border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.fb.ok { background: var(--good-bg); }
.fb.ko { background: var(--bad-bg); }
.fb p { margin: 0; }
.fb-h { font-weight: 600; }
.fb.ok .fb-h { color: var(--good); }
.fb.ko .fb-h { color: var(--bad); }
.fb-e { font-size: 15px; color: var(--ink-2); }
.bar { position: sticky; bottom: 0; padding-top: 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 75%, transparent); margin-top: auto; display: flex; gap: 10px; }
.btn { flex: 1; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 14px; min-height: 54px; font-weight: 600; font-size: 16px; cursor: pointer; }
.btn:disabled { background: var(--surface-2); color: var(--ink-2); cursor: default; }
.btn.alt { background: var(--surface-2); color: var(--ink); }
.confirm { background: var(--surface-2); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.confirm p { margin: 0; }
.confirm .bar { position: static; padding: 0; background: none; }

/* ---- Résultat ---- */
.res { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding-top: 8px; }
.score { font-family: var(--f-disp); font-weight: 600; font-size: 96px; letter-spacing: -.05em; line-height: .95; margin: 0; font-variant-numeric: tabular-nums; }
.score small { font-size: 36px; color: var(--ink-2); font-weight: 500; letter-spacing: -.02em; }
.verdict { display: inline-block; margin: 4px 0 0; padding: 5px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; }
.verdict.ok { background: var(--good-bg); color: var(--good); }
.verdict.ko { background: var(--bad-bg); color: var(--bad); }
.res-s { margin: 4px 0 0; color: var(--ink-2); }
.miss { padding: 18px 22px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.miss p { margin: 0; }
.miss-q { font-weight: 500; }
.miss-a { font-size: 15px; color: var(--ink-2); }
.miss-a b { font-weight: 500; }
.miss-a .no { color: var(--bad); }
.miss-a .yes { color: var(--good); }
.miss-e { font-size: 14px; color: var(--ink-2); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tab[aria-current="page"]:focus-visible, .btn:focus-visible, .btn-go:focus-visible { outline-color: var(--ink); }

/* ---- Finitions : halo discret, surfaces en léger dégradé, filets lumineux, verre sur la barre d'onglets ---- */
body { background: radial-gradient(ellipse 110% 460px at 50% -120px, var(--halo), transparent 70%) no-repeat, var(--bg); }
.brand-name { display: flex; align-items: center; gap: 10px; }
.brand-name::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: linear-gradient(180deg, var(--accent-2), var(--accent)); box-shadow: 0 0 14px var(--glow); flex: none; }
.brand-name span { margin-left: -5px; }
.page-h, .fig b, .exam-t, .score, .stat dd { background: linear-gradient(180deg, var(--ink) 30%, var(--ink-fade)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stat dd small, .score small { -webkit-text-fill-color: var(--ink-2); }
.card, .exam { background: linear-gradient(180deg, var(--surface-top), var(--surface) 140px); border: 1px solid var(--hair); box-shadow: inset 0 1px 0 var(--hair), 0 18px 36px -24px var(--shade); }
.opt { box-shadow: inset 0 1px 0 var(--hair); }
.btn-go, .btn, .tab[aria-current="page"], .veh.wide .veh-btn[aria-pressed="true"] { background: linear-gradient(180deg, var(--accent-2), var(--accent)); box-shadow: inset 0 1px 0 var(--shine), 0 12px 26px -12px var(--glow); }
.btn:disabled, .btn.alt { background: var(--surface-2); box-shadow: inset 0 1px 0 var(--hair); }
.tabs-in { background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); border-color: var(--hair); box-shadow: inset 0 1px 0 var(--hair), 0 16px 40px -8px var(--shade); }
.veh { border: 1px solid var(--hair); }
.meter i, .seg.cur { box-shadow: 0 0 8px var(--glow); }
button { transition: transform .12s ease, background-color .15s ease; }
button:not(:disabled):active { transform: scale(.985); }

/* ---- Animations : pastille d'onglet qui glisse, contenu qui entre en cascade ---- */
body { overflow-x: clip; }
.tabs-in { position: relative; }
.tab { position: relative; z-index: 1; transition: color .25s ease; }
.tab[aria-current="page"] { background: none; box-shadow: none; }
.tab-ind { position: absolute; z-index: 0; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 22px) / 4); border-radius: 17px; background: linear-gradient(180deg, var(--accent-2), var(--accent)); box-shadow: inset 0 1px 0 var(--shine), 0 12px 26px -12px var(--glow); transform: translateX(calc(var(--to) * (100% + 4px))); animation: ind .42s cubic-bezier(.3, 1.35, .5, 1); }
@keyframes ind { from { transform: translateX(calc(var(--from) * (100% + 4px))); } }
.tab[aria-current="page"] svg { animation: pop .42s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { from { transform: scale(.7); } }
.wrap.slide-l > :not(.tabs), .wrap.slide-l > div > :not(.bar) { animation: in-l .38s cubic-bezier(.2, .8, .2, 1) both; }
.wrap.slide-r > :not(.tabs), .wrap.slide-r > div > :not(.bar) { animation: in-r .38s cubic-bezier(.2, .8, .2, 1) both; }
.wrap.rise > :not(.tabs), .wrap.rise > div > :not(.bar) { animation: in-up .42s cubic-bezier(.2, .8, .2, 1) both; }
.wrap[class*="slide-"] > :nth-child(3), .wrap.rise > :nth-child(3) { animation-delay: .05s; }
.wrap[class*="slide-"] > :nth-child(4), .wrap.rise > :nth-child(4) { animation-delay: .1s; }
.wrap[class*="slide-"] > :nth-child(n+5):not(.tabs), .wrap.rise > :nth-child(n+5):not(.tabs) { animation-delay: .15s; }
.wrap[class*="slide-"] .opt:nth-child(2), .wrap.rise .opt:nth-child(2) { animation-delay: .05s; }
.wrap[class*="slide-"] .opt:nth-child(3), .wrap.rise .opt:nth-child(3) { animation-delay: .1s; }
.wrap[class*="slide-"] .opt:nth-child(4), .wrap.rise .opt:nth-child(4) { animation-delay: .15s; }
.wrap[class*="slide-"] .opt, .wrap.rise .opt { animation: in-up .4s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes in-l { from { opacity: 0; transform: translateX(44px); } }
@keyframes in-r { from { opacity: 0; transform: translateX(-44px); } }
@keyframes in-up { from { opacity: 0; transform: translateY(18px); } }
.fb { animation: in-up .32s cubic-bezier(.2, .8, .2, 1) both; }
.opt.ok .chip, .opt.ko .chip { animation: pop .4s cubic-bezier(.3, 1.6, .5, 1); }
.opt.ko { animation: shake .35s ease; }
@keyframes shake { 25% { transform: translateX(-5px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }
.seg, .meter i { transition: background-color .3s ease; }

/* ---- Logo dans l'en-tête ---- */
.brand-name { gap: .3em; font-size: 19px; letter-spacing: .03em; }
.brand-name::before { display: none; }
.brand-name span { display: inline-flex; align-items: center; color: var(--ink); margin-left: 0; }
.brand-name svg { width: .74em; height: .74em; margin: 0 .05em; flex: none; color: var(--accent); filter: drop-shadow(0 0 8px var(--glow)); }

/* ---- Écran de lancement ---- */
.splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; background: radial-gradient(ellipse 120% 60% at 50% 38%, var(--halo), transparent 70%), var(--bg); transition: opacity .5s ease, transform .5s ease; cursor: pointer; }
.splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
.logo { margin: 0; display: flex; gap: .32em; font-family: var(--f-disp); font-weight: 600; font-size: clamp(38px, 12vw, 64px); letter-spacing: .02em; line-height: 1; color: var(--ink); white-space: nowrap; }
.logo span { display: inline-flex; align-items: baseline; animation: in-up .6s cubic-bezier(.2, .8, .2, 1) both; }
.logo span + span { animation-delay: .12s; }
.logo svg { width: .74em; height: .74em; margin: 0 .05em; flex: none; align-self: center; color: var(--accent); filter: drop-shadow(0 0 14px var(--glow)); animation: wheel 1.3s cubic-bezier(.2, .8, .2, 1) .15s both; }
@keyframes wheel { from { transform: rotate(-300deg) scale(.4); opacity: 0; } 30% { opacity: 1; } }
.splash-s { margin: 0; font-size: 13px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-2); animation: in-up .6s cubic-bezier(.2, .8, .2, 1) .45s both; }

/* ---- Contrôle qualité : toucher, survol, pause des scènes, défilement sous la barre d'onglets ---- */
html { scroll-padding-bottom: 110px; }
button, label, input { touch-action: manipulation; }
@media (hover: hover) {
  .btn-go:hover, .btn:not(:disabled):not(.alt):hover { filter: brightness(1.08); }
  .btn.alt:hover, .veh-btn:not([aria-pressed="true"]):hover { background: var(--surface-3); color: var(--ink); }
  .opt:not(:disabled):hover { background: var(--surface-2); }
  .tab:not([aria-current="page"]):hover, .link:hover { color: var(--ink); }
  .prem-pill:hover { filter: brightness(1.2); }
}
.scene { position: relative; }
.sc-pause { position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 50%; background: rgba(8, 10, 14, .55); color: #fff; cursor: pointer; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.sc-pause svg { width: 18px; height: 18px; }
.sc-pause:focus-visible { outline-color: #fff; }
.scene.paused * { animation-play-state: paused !important; }

/* ---- Premium ---- */
.btn-go { display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-go svg, .lock svg { width: 16px; height: 16px; flex: none; }
.lock { display: grid; place-items: center; color: var(--ink-2); }
.row.locked .row-t { color: var(--ink-2); }
.prem-pill { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--hair); background: var(--accent-tint); color: var(--accent-2); font-size: 13px; font-weight: 600; cursor: pointer; }
.prem-pill svg { width: 14px; height: 14px; }
.prem-pill.on { background: var(--good-bg); color: var(--good); }
.price { margin: 0; display: flex; align-items: baseline; gap: 8px; }
.price b { font-family: var(--f-disp); font-weight: 600; font-size: 56px; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; background: linear-gradient(180deg, var(--ink) 30%, var(--ink-fade)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.price span { color: var(--ink-2); font-size: 16px; }
.feat { list-style: none; margin: 0; padding: 16px 0 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.feat li { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; line-height: 1.4; }
.feat svg { width: 20px; height: 20px; flex: none; color: var(--accent); margin-top: 1px; }
.notice { margin: 0; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); font-size: 14px; line-height: 1.45; }
.test { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; border: 1px dashed var(--line); border-radius: 18px; }
.test .kick { margin: 0; }
.test .chk { border-top: 0; padding-top: 0; }

@media (max-width: 380px) {
  .fig b { font-size: 44px; }
  .page-h { font-size: 30px; }
  .stem { font-size: 20px; }
  .score { font-size: 80px; }
  .card, .exam { padding: 18px; }
  .tab { font-size: 12px; }
  .list { padding: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ---- Scènes illustrées (vue conducteur) au-dessus des questions ---- */
.scene{margin:0;border-radius:18px;overflow:hidden;background:#0f1d2e;line-height:0}
.sc{display:block;width:100%;height:auto}
.sc-loop{animation-name:sc-fwd;animation-timing-function:linear;animation-iteration-count:infinite;transform-origin:320px 130px}
@keyframes sc-fwd{from{transform:scale(1)}to{transform:scale(var(--r))}}
.scene-back .sc-loop{animation-direction:reverse}
.sc-ap{animation-name:sc-ap;animation-timing-function:linear;animation-iteration-count:infinite;transform-origin:320px 130px}
@keyframes sc-ap{0%{transform:scale(1);opacity:0}8%{opacity:1}90%{opacity:1}100%{transform:scale(var(--s));opacity:0}}
.sc-blink{animation:scb 1s steps(1) infinite}
@keyframes scb{0%,49%{opacity:1}50%,100%{opacity:.08}}
.sc-flash1{animation:scf .6s steps(1) infinite}
.sc-flash2{animation:scf .6s steps(1) infinite;animation-delay:-.3s}
@keyframes scf{0%,49%{opacity:1}50%,100%{opacity:.12}}
.sc-walk{animation:scw 6s ease-in-out infinite alternate}
@keyframes scw{from{transform:translateX(var(--w0))}to{transform:translateX(var(--w1))}}
.sc-sway{animation:scsw 2.4s ease-in-out infinite alternate}
@keyframes scsw{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
.sc-rain{animation:scr .5s linear infinite}
@keyframes scr{from{transform:translate(0,0)}to{transform:translate(-13.55px,54.34px)}}
.sc-snow{animation:scs 3.4s linear infinite}
.sc-snow2{animation:scs 2.1s linear infinite}
@keyframes scs{from{transform:translateY(0)}to{transform:translateY(70px)}}
.sc-smoke{animation:scsm 2.4s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes scsm{0%{transform:translateY(0) scale(.9);opacity:.9}100%{transform:translateY(-26px) scale(1.15);opacity:.1}}

.rg-streak{transform-origin:320px 130px;animation-name:rgst;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes rgst{0%{transform:scale(.78);opacity:0}25%{opacity:1}100%{transform:scale(1.5);opacity:0}}
.rg-drop{animation-name:rgdr;animation-timing-function:ease-in;animation-iteration-count:infinite}
@keyframes rgdr{0%{transform:translate(0,0);opacity:0}8%{opacity:1}80%{opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}



/* ---- Résultat : message d'encouragement, confettis ---- */
.cheer { margin: 10px 0 0; display: flex; flex-direction: column; gap: 6px; max-width: 34em; }
.cheer b { font-family: var(--f-disp); font-weight: 600; font-size: 22px; letter-spacing: -.01em; line-height: 1.2; color: var(--ink); }

["c-arr-07","arret","c","Stationner devant l'entrée carrossable d'un immeuble ou d'un garage est :","Interdit, car gênant","Autorisé si c'est votre propre garage","Autorisé en dehors des heures de bureau","Autorisé avec un mot sur le pare-brise","Le stationnement devant une entrée carrossable est gênant et interdit, même devant chez soi."],
["c-arr-08","arret","c","Dans une zone bleue, vous devez régler votre disque de stationnement sur :","Votre heure d'arrivée","L'heure à laquelle vous comptez partir","La durée maximale autorisée","Midi","Le disque indique l'heure d'arrivée. Il permet de contrôler que la durée maximale de stationnement n'est pas dépassée."],

["c-vig-08","vigilance","c","Conduire après avoir consommé du cannabis est :","Interdit : c'est un délit, quelle que soit la quantité","Toléré en dessous d'un certain seuil","Autorisé après 2 heures d'attente","Une simple contravention sans retrait de points","La conduite après usage de stupéfiants est un délit, sans seuil de tolérance. Elle entraîne notamment un retrait de 6 points."],
["c-vig-09","vigilance","c","Quel est l'un des effets de l'alcool sur la conduite ?","Il allonge le temps de réaction et rétrécit le champ visuel","Il améliore les réflexes","Il rend plus prudent","Il n'a aucun effet en dessous de 0,5 g/L","Dès les premiers verres, l'alcool allonge le temps de réaction, rétrécit le champ visuel et pousse à prendre plus de risques."],
["c-vig-10","vigilance","c","Vous bâillez, vos paupières sont lourdes et votre nuque est raide. Vous devez :","Vous arrêter dès que possible pour vous reposer","Ouvrir la fenêtre et continuer","Monter le son de la radio","Accélérer pour arriver plus vite","Ce sont les signes de la somnolence. Ouvrir la fenêtre ou monter le son ne suffit pas : seule une pause avec une courte sieste permet de repartir en sécurité."],
["c-vig-11","vigilance","c","Un verre d'alcool standard, comme un demi de bière ou un verre de vin servi au bar, fait monter le taux d'alcool dans le sang d'environ :","0,20 à 0,25 g/L","0,02 g/L","0,50 g/L","1 g/L","Chaque verre standard fait monter le taux d'environ 0,20 à 0,25 g/L. Ce chiffre varie selon le poids, le sexe et le fait d'avoir mangé ou non."],

["c-ecl-05","eclairage","c","Les feux de route éclairent la chaussée à une distance d'au moins :","100 mètres","30 mètres","50 mètres","500 mètres","Les feux de route éclairent à 100 mètres au moins, les feux de croisement à 30 mètres au moins."],
["c-ecl-06","eclairage","c","En plein jour, il pleut très fort. Quels feux devez-vous allumer ?","Les feux de croisement","Aucun, puisqu'il fait jour","Les feux de position seulement","Les feux de route","Quand la visibilité est réduite, même de jour, on allume les feux de croisement pour voir et surtout pour être vu."],
["c-ecl-07","eclairage","c","Quand devez-vous utiliser votre clignotant ?","Avant tout changement de direction ou de voie, y compris pour quitter un stationnement","Seulement en ville","Seulement quand un véhicule vous suit","Uniquement pour tourner à gauche","Le clignotant prévient les autres usagers de ce que vous allez faire. On l'utilise avant de tourner, de changer de voie, de dépasser, de se rabattre ou de quitter un stationnement."],

["c-sou-06","secours","c","Quel numéro d'urgence permet aux personnes sourdes ou malentendantes d'alerter les secours par SMS ?","114","115","119","3919","Le 114 permet d'alerter les secours par SMS. Les autres numéros utiles : 15 pour le SAMU, 17 pour la police, 18 pour les pompiers, 112 partout en Europe."],
["c-sou-07","secours","c","Pour protéger les lieux d'un accident sur une route, vous placez le triangle de présignalisation à environ :","30 mètres au moins avant l'accident","2 mètres du véhicule","Au pied du véhicule","500 mètres","Le triangle se place à 30 mètres au moins, et avant un virage ou un sommet de côte si l'accident se trouve juste derrière. Sur autoroute, on ne le pose pas : c'est trop dangereux."],
["c-sou-08","secours","c","Une victime est inconsciente mais respire. En attendant les secours, vous devez :","La placer sur le côté, en position latérale de sécurité","La laisser sur le dos","Lui donner à boire","La faire asseoir","Une personne inconsciente qui respire est placée en position latérale de sécurité, pour que ses voies respiratoires restent dégagées."],
["c-sou-09","secours","c","Une victime saigne abondamment. Le premier geste est de :","Appuyer fortement sur la plaie","Laver la plaie à l'eau","Attendre les secours sans rien faire","Lui faire lever les jambes","Devant un saignement abondant, on comprime la plaie avec la main, protégée si possible par un tissu propre, jusqu'à l'arrivée des secours."],
["c-sou-10","secours","c","Après un accrochage sans blessé, vous devez :","Remplir un constat amiable avec l'autre conducteur","Partir si les dégâts sont légers","Appeler obligatoirement le SAMU","Attendre la police sans bouger les véhicules","Sans blessé, on remplit un constat amiable et on dégage la chaussée si c'est possible. Quitter les lieux sans s'arrêter est un délit de fuite."],

["c-per-06","permis","c","Au moment où vous obtenez votre premier permis de conduire, il compte :","6 points","12 points","8 points","3 points","Le permis probatoire commence avec 6 points. Sans infraction, le capital augmente chaque année jusqu'à atteindre 12 points."],
["c-per-07","permis","c","Après une conduite accompagnée, la période probatoire dure :","2 ans","3 ans","1 an","6 mois","La période probatoire est de 2 ans après un apprentissage anticipé de la conduite, contre 3 ans après une formation traditionnelle."],
["c-per-08","permis","c","Franchir un feu rouge entraîne un retrait de :","4 points","1 point","2 points","6 points","Ne pas respecter l'arrêt au feu rouge coûte 4 points et une amende forfaitaire de 135 euros."],
["c-per-09","permis","c","Tenir son téléphone en main en conduisant entraîne un retrait de :","3 points","1 point","4 points","6 points","L'usage du téléphone tenu en main est sanctionné par 3 points en moins et une amende forfaitaire de 135 euros."],
["c-per-10","permis","c","Conduire avec un taux d'alcool de 0,8 g/L de sang ou plus est :","Un délit","Une contravention sans retrait de points","Toléré sur un trajet court","Autorisé hors agglomération","À partir de 0,8 g/L de sang, la conduite sous l'emprise de l'alcool est un délit, jugé par le tribunal. Il entraîne notamment un retrait de 6 points."],

["c-rou-05","route","c","Sur autoroute, quand la circulation est fluide et les conditions bonnes, vous ne pouvez rouler sur la voie la plus à gauche qu'à une vitesse d'au moins :","80 km/h","50 km/h","60 km/h","110 km/h","La voie la plus à gauche d'une autoroute est interdite aux véhicules qui roulent à moins de 80 km/h, quand la circulation est fluide."],
["c-rou-06","route","c","Votre voiture tombe en panne sur l'autoroute. Une fois arrêté sur la bande d'arrêt d'urgence, vous devez :","Mettre votre gilet, sortir côté droit et vous placer derrière la glissière","Rester assis dans le véhicule","Poser le triangle à 30 mètres sur la chaussée","Réparer vous-même sur place","Sur autoroute, le danger vient des véhicules qui passent. Tout le monde sort côté droit avec un gilet et se met à l'abri derrière la glissière, avant d'appeler depuis une borne orange."],
["c-rou-07","route","c","Sur autoroute, faire demi-tour ou marche arrière est :","Interdit dans tous les cas","Autorisé sur la bande d'arrêt d'urgence","Autorisé au péage","Autorisé si aucun véhicule n'arrive","Le demi-tour et la marche arrière sont interdits sur autoroute, y compris sur la bande d'arrêt d'urgence et aux abords des péages."],
["c-rou-08","route","c","Sur autoroute, pour garder une bonne distance de sécurité, vous laissez entre vous et le véhicule qui précède :","Au moins 2 traits de la bande d'arrêt d'urgence","1 trait de la bande d'arrêt d'urgence","La longueur d'une voiture","10 mètres","Le repère est simple : un trait, danger ; deux traits, sécurité. Deux traits de la ligne de rive correspondent à peu près à la distance de sécurité à 130 km/h."],

["c-con-01","conduite","c","Laquelle de ces habitudes réduit la consommation de carburant ?","Anticiper et garder une allure régulière","Accélérer fort après chaque arrêt","Rouler avec des pneus sous-gonflés","Rester longtemps sur les petits rapports","Une conduite souple fait baisser la consommation : on anticipe les ralentissements, on garde une allure régulière et on passe les rapports sans pousser le moteur."],
["c-veh-01","vehicule","c","À quoi sert la vignette Crit'Air ?","À classer le véhicule selon ses émissions polluantes","À prouver que le véhicule est assuré","À remplacer le contrôle technique","À payer le stationnement","Le certificat Crit'Air classe les véhicules selon leurs émissions. Il est exigé pour circuler dans les zones à faibles émissions et lors des pics de pollution."],

["v-sec-07","securite","v","Votre voiture est équipée d'airbags. La ceinture de sécurité est alors :","Toujours obligatoire : l'airbag ne protège qu'avec la ceinture","Inutile","Obligatoire seulement sur autoroute","Obligatoire seulement pour le conducteur","L'airbag complète la ceinture, il ne la remplace pas. Sans ceinture, l'airbag peut même aggraver les blessures."],
["v-sec-08","securite","v","À quoi sert un appuie-tête bien réglé ?","À protéger les cervicales en cas de choc","À reposer la tête pendant la conduite","À mieux voir dans le rétroviseur","À tenir la ceinture en place","L'appuie-tête limite le « coup du lapin » lors d'un choc, surtout par l'arrière. Son sommet doit arriver à la hauteur du haut de la tête."],
["v-sec-09","securite","v","Un passager de 12 ans voyage sans ceinture à l'arrière. Qui est responsable ?","Le conducteur","L'enfant","Personne, la ceinture est facultative à l'arrière","Le propriétaire du véhicule, même s'il est absent","Le conducteur doit s'assurer que tout passager de moins de 18 ans est correctement attaché. C'est lui qui est sanctionné."],
["v-ecl-02","eclairage","v","Des feux blancs s'allument à l'arrière de la voiture devant vous. Cela signifie :","Qu'elle va reculer ou qu'elle recule","Qu'elle freine","Qu'elle tourne à droite","Que ses feux antibrouillard sont allumés","Les feux de recul, blancs, s'allument quand la marche arrière est engagée."],
["v-veh-06","vehicule","v","Après le premier contrôle technique d'une voiture, les suivants ont lieu :","Tous les 2 ans","Tous les ans","Tous les 4 ans","Tous les 5 ans","Le premier contrôle technique a lieu dans les 6 mois avant les 4 ans du véhicule, puis tous les 2 ans."],
["v-veh-07","vehicule","v","Un voyant orange s'allume sur le tableau de bord. En général, il signale :","Une anomalie à faire vérifier rapidement","Un fonctionnement normal","Un arrêt immédiat obligatoire","Que le plein est fait","Un voyant orange signale une anomalie ou un entretien à prévoir : on peut souvent continuer avec prudence, mais il faut faire vérifier sans tarder. Un voyant rouge impose de s'arrêter."],
["v-veh-08","vehicule","v","Dans quelles conditions contrôle-t-on le niveau d'huile du moteur ?","Moteur arrêté, sur un sol plat","Moteur en marche","Juste après un long trajet, sans attendre","Dans une pente","Le niveau se contrôle sur sol plat, moteur arrêté depuis quelques minutes. Il doit se situer entre les repères mini et maxi de la jauge."],
["v-veh-09","vehicule","v","Rouler avec des pneus sous-gonflés :","Augmente la consommation, l'usure et le risque d'éclatement","Améliore la tenue de route","Réduit la distance de freinage","N'a aucune conséquence","Un pneu sous-gonflé chauffe, s'use vite et peut éclater. La voiture consomme plus et tient moins bien la route."],
["v-per-03","permis","v","Avec le seul permis B, vous pouvez tracter sans formation supplémentaire une remorque dont le PTAC ne dépasse pas :","750 kg","500 kg","1 500 kg","3 500 kg","Le permis B permet de tracter une remorque de 750 kg de PTAC au maximum. Au-delà, des conditions de poids total s'appliquent, avec parfois une formation ou un autre permis."],
["v-con-03","conduite","v","Dans une longue descente, pour ménager vos freins, vous devez :","Utiliser le frein moteur en rétrogradant","Rouler au point mort","Freiner en continu jusqu'en bas","Couper le moteur","Un rapport inférieur fait retenir la voiture par le moteur. Freiner sans arrêt échauffe les freins, qui peuvent perdre leur efficacité."],
["v-con-04","conduite","v","Il pleut fort. Utiliser le régulateur de vitesse est :","Déconseillé, car il empêche de réagir vite en cas d'aquaplanage","Obligatoire","Sans aucune incidence","Recommandé pour mieux freiner","Sur route très mouillée, il vaut mieux garder le contrôle de l'accélérateur : en cas de perte d'adhérence, on doit pouvoir lever le pied tout de suite."],
["v-con-05","conduite","v","Comment vérifier qu'aucun usager ne se trouve dans votre angle mort ?","En tournant brièvement la tête, en plus des rétroviseurs","En regardant seulement le rétroviseur intérieur","En klaxonnant","En accélérant","L'angle mort est la zone que les rétroviseurs ne montrent pas. Un coup d'œil par-dessus l'épaule est indispensable avant de changer de voie ou de direction."],
["v-arr-01","arret","v","Vous stationnez dans une rue en pente. En plus du frein de stationnement, vous devez :","Enclencher une vitesse et braquer les roues vers le trottoir","Laisser le levier au point mort","Allumer les feux de détresse","Laisser tourner le moteur","En pente, on serre le frein de stationnement, on enclenche un rapport et on braque les roues vers le trottoir pour que la voiture ne puisse pas partir."],

["m-sec-05","securite","m","En France, les éléments rétroréfléchissants sur un casque de moto sont :","Obligatoires","Interdits","Facultatifs","Réservés aux casques blancs","Le casque doit porter des éléments rétroréfléchissants, à l'avant, à l'arrière et sur les côtés, pour être vu de nuit."],
["m-sec-06","securite","m","À moto, le gilet de haute visibilité :","Doit être à portée de main et porté en cas d'arrêt d'urgence","Doit être porté en permanence","N'est obligatoire que pour le passager","N'est pas obligatoire","Le conducteur d'une moto doit avoir un gilet de haute visibilité sur lui ou dans un rangement, et le porter s'il descend de son véhicule après un arrêt d'urgence."],
["m-sec-07","securite","m","En plus du casque et des gants, quel équipement est fortement recommandé à moto ?","Un blouson, un pantalon et des chaussures montantes renforcés","Un simple tee-shirt en été","Des baskets basses","Un sac à dos lourd","En cas de chute, seuls des vêtements couvrants et renforcés protègent de l'abrasion et des chocs. Une protection dorsale complète utilement la tenue."],
["m-con-08","conduite","m","Vous roulez à 60 km/h et voulez incliner la moto vers la droite. Vous devez :","Pousser légèrement sur la poignée droite du guidon","Pousser sur la poignée gauche","Tirer fort sur les deux poignées","Freiner de l'avant","C'est le contre-braquage : au-delà de 40 km/h environ, une poussée sur la poignée droite fait pencher la moto à droite."],
["m-con-09","conduite","m","En circulation inter-files, votre vitesse ne doit pas dépasser :","50 km/h, et 30 km/h si l'une des files est à l'arrêt","70 km/h","90 km/h","La vitesse limite de la route","La circulation inter-files se pratique entre les deux voies les plus à gauche, quand le trafic est dense, à 50 km/h au maximum, et à 30 km/h si une file est arrêtée."],
["m-con-10","conduite","m","Dans un virage, où devez-vous porter votre regard ?","Loin, vers la sortie du virage","Sur la roue avant","Sur le bord de la route","Sur le compteur","La moto va là où le regard se pose. Regarder loin vers la sortie donne une trajectoire sûre et laisse le temps d'anticiper."],
["m-con-11","conduite","m","Avec un passager, votre moto :","Freine sur une distance plus longue et réagit plus lentement","Freine plus court","Se comporte exactement de la même façon","Accélère plus fort","Le poids du passager allonge le freinage et modifie l'équilibre. On adapte sa conduite, la pression des pneus et le réglage de la suspension."],
["m-con-12","conduite","m","Vous venez de démarrer par temps froid. Vos pneus :","Adhèrent moins tant qu'ils ne sont pas en température","Adhèrent mieux qu'à chaud","Sont à leur pression maximale","N'ont pas besoin d'attention","Un pneu froid adhère moins. Pendant les premiers kilomètres, on évite de prendre de l'angle et de freiner fort."],
["m-per-05","permis","m","Pour passer du permis A2 au permis A, il faut :","Avoir le permis A2 depuis au moins 2 ans et suivre une formation de 7 heures","Repasser tout l'examen pratique","Attendre 5 ans, sans aucune formation","Avoir au moins 30 ans","Après 2 ans de permis A2, une formation de 7 heures en école de conduite permet d'obtenir le permis A, sans nouvel examen."],
["m-per-06","permis","m","À partir de quel âge peut-on passer le permis A1 ?","16 ans","14 ans","18 ans","20 ans","Le permis A1, pour les motos légères de 125 cm³ au plus, se passe à partir de 16 ans."],
["m-veh-01","vehicule","m","La profondeur minimale des rainures des pneus d'une moto est de :","1 mm","0,1 mm","1,6 mm","3 mm","Pour une motocyclette, la profondeur minimale est de 1 mm. Des témoins d'usure permettent de la contrôler."],
["m-veh-02","vehicule","m","Sur une moto à transmission par chaîne, il faut régulièrement :","Contrôler la tension de la chaîne et la graisser","Laver la chaîne à l'eau chaude","Démonter la chaîne à chaque plein","Ne rien faire, elle est sans entretien","Une chaîne trop tendue, détendue ou sèche s'use vite et peut casser ou dérailler. On contrôle sa tension et on la graisse régulièrement."],
["m-arr-02","arret","m","Avant de démarrer, vous devez vous assurer que la béquille latérale est :","Complètement relevée","À moitié dépliée","Dépliée, pour pouvoir vous arrêter vite","Peu importe","Une béquille restée dépliée peut toucher le sol dans le premier virage à gauche et provoquer une chute."],

/* ---------- Situations de priorité, ajoutées le 12 novembre 2026 ---------- */
["c-pri-14","priorite","c","Vous arrivez à une intersection sans panneau ni feu. Une voiture arrive par votre gauche, personne ne vient de droite. Vous :","Passez avec prudence : c'est à elle de vous céder le passage","Vous arrêtez pour la laisser passer","Accélérez en klaxonnant","Attendez qu'elle vous fasse signe","Sans signalisation, on cède le passage aux véhicules venant de droite, pas à ceux venant de gauche. Vous restez prudent et vérifiez que l'autre conducteur ralentit bien."],
["c-pri-15","priorite","c","À une intersection sans signalisation, vous voulez tourner à droite. Une voiture arrive par la droite. Vous devez :","Lui céder le passage, même si vous tournez à droite","Passer, puisque vous ne coupez pas sa route","Passer, à condition d'avoir mis le clignotant","Passer, car vous étiez là le premier","La priorité à droite s'applique quelle que soit la direction que vous prenez. Vous laissez passer le véhicule venant de droite avant de tourner."],
["c-pri-16","priorite","c","Dans cette rue, l'intersection n'a ni panneau, ni feu, ni marquage. Quelle règle s'applique ?","La priorité à droite","La priorité à la rue la plus large","La priorité au véhicule qui roule le plus vite","La priorité à celui qui arrive le premier","En l'absence de toute signalisation, chaque conducteur doit céder le passage aux véhicules qui viennent de sa droite."],
["c-pri-17","priorite","c","Vous roulez sur une large avenue. Une petite rue sans aucun panneau débouche à droite et une voiture s'y présente. Qui passe en premier ?","La voiture qui vient de droite","Vous, car votre avenue est plus large","Vous, car vous roulez plus vite","Celui qui klaxonne le premier","La largeur d'une rue ne donne aucune priorité. Sans panneau ni feu, le véhicule qui vient de droite est prioritaire."],
["c-pri-18","priorite","c","Un panneau triangulaire montre une flèche épaisse coupée par un trait fin. Il vous annonce que :","Vous êtes prioritaire à la prochaine intersection seulement","Vous êtes prioritaire à toutes les intersections de cette route","Vous devez céder le passage à droite","La chaussée va se rétrécir","Ce panneau donne la priorité pour la prochaine intersection uniquement. Aux suivantes, on applique la signalisation en place ou, à défaut, la priorité à droite."],
["c-pri-19","priorite","c","Un losange jaune barré d'un trait noir oblique annonce :","La fin de la route prioritaire","Le début d'une route prioritaire","Une interdiction de dépasser","Une route à sens unique","Après ce panneau, vous n'êtes plus prioritaire par principe. Aux intersections suivantes, vous respectez les panneaux ou, s'il n'y en a pas, la priorité à droite."],
["c-pri-20","priorite","c","Vous arrivez à un STOP. La visibilité est parfaite et aucun véhicule n'approche. Vous devez :","Marquer l'arrêt complet à la ligne, puis repartir","Ralentir et passer sans vous arrêter","Vous arrêter seulement si un véhicule arrive","Passer au pas","Au STOP, l'arrêt est obligatoire dans tous les cas, à la limite de la chaussée abordée. Ne pas le marquer coûte 4 points."],
["c-pri-21","priorite","c","Vous arrivez à un « cédez le passage ». Aucun véhicule n'approche sur la route que vous abordez. Vous :","Pouvez passer sans vous arrêter, après avoir ralenti et vérifié","Devez toujours marquer l'arrêt","Devez klaxonner avant de passer","Êtes prioritaire sur cette route","Le « cédez le passage » n'impose pas l'arrêt : il oblige à laisser passer les autres. Si la voie est libre et la visibilité suffisante, vous pouvez continuer."],
["c-pri-22","priorite","c","Votre feu est vert, mais des véhicules sont immobilisés dans le carrefour. Vous devez :","Attendre avant la ligne tant que vous risquez de rester bloqué dans le carrefour","Vous engager, puisque le feu est vert","Klaxonner pour faire avancer les autres","Passer par la voie de gauche","Même au feu vert, on ne s'engage dans une intersection que si l'on est sûr de pouvoir la dégager. Rester bloqué au milieu gêne ceux qui auront le vert ensuite."],
["c-pri-23","priorite","c","Votre feu est vert et vous voulez tourner à gauche. Une voiture arrive en face et va tout droit. Vous devez :","Lui céder le passage avant de tourner","Passer en premier, puisque votre feu est vert","Lui faire un appel de phares pour passer","Tourner vite avant qu'elle n'arrive","Le feu vert autorise à s'engager, il ne donne pas la priorité sur ceux qui viennent d'en face. Pour tourner à gauche, on laisse passer les véhicules arrivant en sens inverse."],
["c-pri-24","priorite","c","Votre feu est vert et vous tournez à droite. Un piéton traverse la rue dans laquelle vous entrez. Vous devez :","Le laisser traverser","Passer devant lui, puisque votre feu est vert","Klaxonner pour qu'il se dépêche","Le contourner sans ralentir","En changeant de direction, vous devez céder le passage aux piétons qui traversent la rue où vous vous engagez. Leur feu est d'ailleurs souvent vert en même temps que le vôtre."],
["c-pri-25","priorite","c","Les feux de ce carrefour sont éteints. Un panneau « cédez le passage » est fixé sous le feu. Vous devez :","Respecter le panneau et céder le passage","Passer comme si le feu était vert","Appliquer la priorité à droite, sans tenir compte du panneau","Attendre que les feux se rallument","Quand les feux sont éteints ou à l'orange clignotant, ce sont les panneaux placés sur leur support qui s'appliquent. S'il n'y en a pas, c'est la priorité à droite."],
["c-pri-26","priorite","c","En ville, un autobus à l'arrêt met son clignotant pour repartir. Vous devez :","Ralentir et, au besoin, vous arrêter pour le laisser repartir","Accélérer pour passer avant lui","Klaxonner pour qu'il attende","Le dépasser sans changer d'allure","En agglomération, les conducteurs doivent ralentir, et s'arrêter si nécessaire, pour laisser les véhicules de transport en commun quitter leur arrêt."],
["c-pri-27","priorite","c","Un piéton au bord du trottoir montre clairement qu'il veut traverser devant vous. Vous devez :","Lui céder le passage, en vous arrêtant si nécessaire","Continuer : il doit attendre que la voie soit libre","Klaxonner pour le prévenir","Accélérer pour passer avant lui","Tout conducteur doit céder le passage au piéton qui traverse régulièrement ou qui manifeste clairement son intention de le faire. Le refus de priorité à un piéton coûte 6 points."],

        '<h3>Nature du contenu</h3>' +

    'confidentialite': function () {
      return '<p class="lead">Easy Code fonctionne sans compte, sans formulaire et sans publicité. Il n\'enregistre que ce qui sert à suivre ta progression.</p>' +
        '<h3>Responsable du traitement</h3>' +
        '<p>' + OWNER + ', éditeur du site. Contact : ' + contactHTML() + '.</p>' +
        '<h3>Données enregistrées</h3>' +
        '<ul>' +
        '<li><b>Ta progression</b> : le permis choisi (voiture ou moto), le réglage du chronomètre, le nombre de réponses et de bonnes réponses pour chaque question, les questions à revoir, et pour chaque examen blanc sa date, son score et le permis concerné.</li>' +
        '<li><b>Le dernier onglet ouvert</b>, pour le rouvrir à ta prochaine visite.</li>' +
        '<li><b>L\'état Premium du mode aperçu</b>, tant que le paiement n\'existe pas.</li>' +
        '<li><b>Le réglage des sons</b>, activés ou coupés.</li>' +
        '</ul>' +
        '<p>Easy Code ne te demande ni nom, ni adresse e-mail, ni numéro de téléphone, ni position, ni moyen de paiement. Il n\'y a ni mesure d\'audience, ni publicité, ni bouton de réseau social.</p>' +
        '<h3>Où elles sont stockées</h3>' +
        '<p>Ces informations sont enregistrées dans ton navigateur, sur ton appareil (stockage local).</p>' +
        (IS_APP ? '' : '<p>Si tu ouvres Easy Code en étant connecté à un compte Claude, une copie de ta progression est aussi enregistrée chez l\'hébergeur, Anthropic, dans un espace rattaché à ton compte. Elle sert uniquement à retrouver ta progression sur tes autres appareils. L\'éditeur d\'Easy Code n\'a pas accès à cet espace.</p>') +
        '<h3>Pourquoi, et sur quelle base</h3>' +
        '<p>Ces données servent uniquement à faire fonctionner le suivi de progression que tu utilises. Leur traitement repose sur l\'exécution du service que tu demandes (article 6.1.b du RGPD).</p>' +
        '<p>Elles ne servent ni à établir ton profil ni à t\'envoyer de la publicité. Elles ne sont ni vendues ni cédées.</p>' +
        '<h3>Durée de conservation</h3>' +
        '<p>Ta progression est conservée tant que tu ne l\'effaces pas. Tu peux l\'effacer à tout moment : elle est alors supprimée de cet appareil' + (IS_APP ? '.' : ' et, si tu es connecté à un compte Claude, de l\'espace rattaché à ton compte.') + '</p>' +
        '{{WIPE}}' +
        (IS_APP
          ? '<h3>Aucun envoi de données</h3>' +
            '<p>L\'application n\'envoie aucune donnée à un serveur : aucune de ses fonctions ne se connecte à Internet.</p>' +
            (IS_DESKTOP ? '<p>GitHub traite de son côté les données liées au téléchargement de l\'application, selon ses propres règles.</p>' : '<p>Google Play traite de son côté les données liées au téléchargement et aux mises à jour de l\'application, selon ses propres règles.</p>')
          : '<h3>Hébergeur et transferts hors de l\'Union européenne</h3>' +
            '<p>Le site est hébergé par Anthropic, dont la maison mère est aux États-Unis. Comme pour tout site, l\'hébergeur traite des données techniques de connexion, par exemple ton adresse IP, pour afficher les pages et assurer leur sécurité.</p>' +
            '<p>Si tu utilises un compte Claude, Anthropic traite les données de ce compte selon sa propre politique, qui décrit aussi les garanties appliquées aux transferts hors de l\'Union européenne : ' + ANTHROPIC_PRIVACY + '.</p>') +
        '<h3>Tes droits</h3>' +
        '<p>Tu disposes d\'un droit d\'accès, de rectification, d\'effacement, de limitation, d\'opposition et de portabilité sur tes données. Pour les exercer, écris à : ' + contactHTML() + '. Tu recevras une réponse dans un délai d\'un mois.</p>' +
        '<p>Comme Easy Code ne connaît pas ton identité, le moyen le plus direct d\'effacer tes données reste le bouton « Effacer ma progression ».</p>' +
        '<p>Si tu estimes que tes droits ne sont pas respectés, tu peux adresser une réclamation à la CNIL : <a href="https://www.cnil.fr/fr/plaintes" rel="noopener">cnil.fr/fr/plaintes</a>, ou CNIL, 3 place de Fontenoy, TSA 80715, 75334 Paris Cedex 07.</p>';
    },

    'cookies': function () {
      return '<p class="lead">Easy Code ne dépose aucun cookie et n\'utilise aucun traceur de publicité ou de mesure d\'audience. Il n\'y a donc pas de bandeau de consentement.</p>' +
        '<h3>Ce qui est enregistré sur ton appareil</h3>' +
        '<p>Le site utilise le stockage local de ton navigateur, une technologie proche des cookies, pour quatre informations :</p>' +
        '<dl>' +
        '<dt><code>prepa-code-v1</code></dt><dd>Ta progression : réponses, questions à revoir, examens blancs, permis choisi, réglage du chronomètre.</dd>' +
        '<dt><code>easycode-tab</code></dt><dd>Le dernier onglet ouvert.</dd>' +
        '<dt><code>easycode-premium</code></dt><dd>L\'état Premium du mode aperçu.</dd>' +
        '<dt><code>easycode-sound</code></dt><dd>Le réglage des sons, activés ou coupés.</dd>' +
        '</dl>' +
        '<p>Elles restent sur ton appareil jusqu\'à ce que tu les effaces.</p>' +
        '<h3>Pourquoi aucun consentement n\'est demandé</h3>' +
        '<p>Ces enregistrements sont strictement nécessaires au service que tu utilises : sans eux, le site ne peut pas retenir ta progression. L\'article 82 de la loi Informatique et Libertés dispense ce type d\'enregistrement de consentement. Ils ne servent pas à te suivre d\'un site à l\'autre.</p>' +
        '<h3>Services tiers</h3>' +
        '<p>Easy Code ne charge aucune ressource chez un tiers : les polices d\'écriture sont intégrées au site.</p>' +
        (IS_APP ? '' : '<p>La plateforme claude.ai, qui héberge le site, peut utiliser ses propres cookies, par exemple pour la connexion à ton compte Claude. Ils relèvent d\'Anthropic : ' + ANTHROPIC_PRIVACY + '.</p>') +
        '<h3>Effacer ou bloquer</h3>' +
        '{{WIPE}}' +
        '<p>Tu peux aussi effacer les données du site dans les réglages de ton navigateur, ou y bloquer le stockage local. Le site fonctionne alors sans retenir ta progression.</p>' +
        '<p>Pour le détail des données et de tes droits, voir ' + legalLink('confidentialite', 'la page Confidentialité') + '.</p>';
    },

    'conditions': function () {
      return '<h3>1. Objet</h3>' +
        '<p>Easy Code est un site d\'entraînement au code de la route, voiture et moto. En l\'utilisant, tu acceptes les présentes conditions.</p>' +
        '<h3>2. Accès</h3>' +
        '<p>Le site est accessible gratuitement, sans inscription. Certaines séries portent la mention Premium : cette offre n\'est pas encore commercialisée. Voir ' + legalLink('abonnement') + '.</p>' +
        '<h3>3. Un outil d\'entraînement, pas une source officielle</h3>' +
        '<p>Les questions sont rédigées pour s\'entraîner. Ce ne sont pas les questions officielles de l\'examen, et Easy Code ne remplace pas la formation d\'une auto-école.</p>' +
        '<p>Les règles peuvent changer et, malgré le soin apporté, une erreur reste possible. Easy Code ne garantit pas la réussite à l\'examen. En cas de doute, vérifie sur service-public.fr ou sur Légifrance.</p>' +
        '<h3>4. Utilisation autorisée</h3>' +
        '<p>Le site est destiné à un usage personnel. Il est interdit de copier, de republier ou de revendre son contenu, et de chercher à perturber son fonctionnement.</p>' +
        '<h3>5. Assistants et agents IA</h3>' +
        '<p>Un assistant ou un agent automatisé peut consulter le site pour le compte d\'un utilisateur, dans les mêmes conditions. La reprise en masse des questions pour les republier reste interdite sans accord.</p>' +
        '<h3>6. Ta progression</h3>' +
        '<p>Ta progression est enregistrée sur ton appareil. Elle peut être perdue si tu effaces les données de ton navigateur ou si tu changes d\'appareil. Easy Code ne garantit pas sa conservation.</p>' +
        '<h3>7. Disponibilité et responsabilité</h3>' +
        '<p>Le site est proposé gratuitement, en l\'état. Il peut évoluer, être interrompu ou fermé sans préavis.</p>' +
        '<p>Dans les limites permises par la loi, l\'éditeur ne peut pas être tenu responsable d\'une erreur de contenu ou d\'une indisponibilité du site. Rien dans ces conditions ne te prive des droits que la loi te garantit.</p>' +
        '<h3>8. Données personnelles</h3>' +
        '<p>Voir ' + legalLink('confidentialite', 'la page Confidentialité') + ' et ' + legalLink('cookies', 'la page Cookies') + '.</p>' +
        '<h3>9. Évolution des conditions</h3>' +
        '<p>Ces conditions peuvent être modifiées. La version en vigueur est celle affichée ici, avec sa date de mise à jour.</p>' +
        '<h3>10. Droit applicable</h3>' +
        '<p>Ces conditions sont soumises au droit français. En cas de litige, les tribunaux français sont compétents selon les règles prévues par la loi.</p>' +
        '<h3>11. Contact</h3>' +
        '<p>' + OWNER + ' : ' + contactHTML() + '.</p>';
    },

    'abonnement': function () {
      return '<p class="lead">Aujourd\'hui, Easy Code ne vend rien. Aucun paiement n\'est possible sur le site, aucune donnée bancaire n\'est demandée et rien ne peut être débité.</p>' +
        '<h3>L\'offre Premium affichée</h3>' +
        '<p>L\'écran Premium présente une offre prévue à 0,99 € par mois. Elle n\'est pas encore commercialisée : le bouton « S\'abonner » ne déclenche aucun paiement et ne crée aucun engagement.</p>' +
        '<h3>Remboursement</h3>' +
        '<p>Aucune somme n\'étant encaissée, il n\'y a rien à rembourser à ce jour.</p>' +
        '<h3>Avant l\'ouverture de l\'abonnement</h3>' +
        '<p>Avant le premier paiement, cette page sera remplacée par des conditions générales de vente complètes, que tu devras accepter avant de payer. Elles préciseront notamment :</p>' +
        '<ul>' +
        '<li>l\'identité et les coordonnées du vendeur ;</li>' +
        '<li>le prix toutes taxes comprises et les moyens de paiement ;</li>' +
        '<li>la durée de l\'abonnement et son renouvellement ;</li>' +
        '<li>le droit de rétractation de 14 jours prévu par la loi pour les achats à distance, et la façon de l\'exercer ;</li>' +
        '<li>la façon de résilier en ligne ;</li>' +
        '<li>les garanties légales et les coordonnées du médiateur de la consommation.</li>' +
        '</ul>';
    }
  };

  function renderLegal() {
    var body = LEGAL_BODY[legalPage]().split('{{WIPE}}').join(wipeHTML());
    var h = '<div class="qtop"><button class="link" data-act="home">← Retour</button><span class="qlab"></span><span></span></div>';
    h += '<h1 class="page-h" id="legal-h" tabindex="-1">' + legalTitle(legalPage) + '</h1>';
    h += '<article class="legal" aria-labelledby="legal-h">' + fr(body) +
      '<p class="foot">' + fr('Dernière mise à jour : ' + LEGAL_DATE + '.') + '</p></article>';
    h += footHTML(legalPage);
    return h;
  }

  function openLegal(k) {
    if (!LEGAL_BODY[k]) return;
    stopTimer(); sess = null; view = 'legal'; legalPage = k; wipeAsk = false; wipeDone = false;
    try { if (location.hash !== '#' + k) history.replaceState(null, '', '#' + k); } catch (e) {}
    render(); anim('rise'); window.scrollTo(0, 0);
    var t = document.getElementById('legal-h');
    if (t) { try { t.focus({ preventScroll: true }); } catch (e) {} }
  }

  /* ---------- Événements ---------- */
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var a = b.getAttribute('data-act');
    if (a !== 'validate' || (sess && sess.kind === 'exam')) SND.tap();
    if (a === 'legal') { e.preventDefault(); openLegal(b.getAttribute('data-p')); return; }
    if (a === 'wipe') { wipeAsk = true; wipeDone = false; render(); return; }
    if (a === 'wipe-no') { wipeAsk = false; render(); return; }
    if (a === 'wipe-yes') { wipe(); return; }
    if (a === 'veh') { S.veh = b.getAttribute('data-v'); touch(); render(); }
    else if (a === 'tab') setTab(b.getAttribute('data-tab'));
    else if (a === 'scene-pause') {
      var fg = b.closest('.scene'), on = !fg.classList.contains('paused');
      fg.classList.toggle('paused', on);
      b.setAttribute('aria-pressed', on);
      b.setAttribute('aria-label', on ? 'Relancer l\'animation' : 'Mettre l\'animation en pause');
      b.innerHTML = on ? ICON_PLAY : ICON_PAUSE;
    }
    else if (a === 'premium') openPremium();
    else if (a === 'sub') { payMsg = true; render(); }
    else if (a === 'exam') startSession('exam');
    else if (a === 'mix') startSession('mix');
    else if (a === 'theme') startSession('theme', b.getAttribute('data-t'));
    else if (a === 'errors') startSession('errors');
    else if (a === 'pick') { if (sess.phase === 'ask') { sess.sel = +b.getAttribute('data-d'); sess.focus = 'opt'; render(); } }
    else if (a === 'validate') { if (sess.sel !== null) answer(sess.sel); }
    else if (a === 'next') advance();
    else if (a === 'quit') { sess.confirm = true; render(); window.scrollTo(0, 0); }
    else if (a === 'quit-no') { sess.confirm = false; sess.focus = 'stem'; render(); }
    else if (a === 'quit-yes') goHome();
    else if (a === 'again') startSession(sess.kind, sess.theme);
    else if (a === 'home') goHome();
  });

  /* ---------- Glisser pour changer d'onglet ---------- */
  function setTab(t, dir) {
    if (t === tab) return;
    var order = TABS.map(function (x) { return x[0]; });
    if (!dir) dir = order.indexOf(t) > order.indexOf(tab) ? 'l' : 'r';
    tab = t;
    if ((tab === 'voiture' || tab === 'moto') && S.veh !== tab) { S.veh = tab; touch(); }
    try { localStorage.setItem('easycode-tab', tab); } catch (err) {}
    try { if (location.hash !== '#' + HASH[tab]) history.replaceState(null, '', '#' + HASH[tab]); } catch (err) {}
    render();
    window.scrollTo(0, 0);
    anim('slide-' + dir);
  }
  var sw = null;
  app.addEventListener('touchstart', function (e) {
    sw = null;
    if (view !== 'home' || e.touches.length !== 1) return;
    if (e.target.closest && e.target.closest('input, .plot-wrap')) return;
    sw = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
  }, { passive: true });
  app.addEventListener('touchend', function (e) {
    if (!sw || view !== 'home') { sw = null; return; }
    var c = e.changedTouches[0], dx = c.clientX - sw.x, dy = c.clientY - sw.y, dt = Date.now() - sw.t;
    sw = null;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.8 || dt > 700) return;
    var order = TABS.map(function (x) { return x[0]; }), i = order.indexOf(tab) + (dx < 0 ? 1 : -1);
    if (i < 0 || i >= order.length) return;
    setTab(order[i], dx < 0 ? 'l' : 'r');
  }, { passive: true });
  app.addEventListener('touchcancel', function () { sw = null; }, { passive: true });

  app.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'chrono') { S.chrono = e.target.checked; touch(); }
    if (e.target && e.target.id === 'snd-on') { SND.set(e.target.checked); SND.tap(); }
    if (e.target && e.target.id === 'prem-test') { premium = e.target.checked; payMsg = false; try { localStorage.setItem('easycode-premium', premium ? '1' : '0'); } catch (err) {} render(); }
  });

  document.addEventListener('keydown', function (e) {
    if (view !== 'quiz' || !sess || e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    var d = 'abcd'.indexOf(k);
    if (d < 0) d = '1234'.indexOf(k);
    if (d > -1 && k.length === 1 && sess.phase === 'ask' && !sess.confirm) { sess.sel = d; sess.focus = 'opt'; render(); return; }
    if (k === 'Enter') {
      var tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'BUTTON') return;
      if (sess.phase === 'ask' && sess.sel !== null && !sess.confirm) answer(sess.sel);
      else if (sess.phase === 'fb') advance();
    }
  });

  render();
  initCloud();
  if (legalFromHash()) openLegal(legalFromHash());

  /* ---------- Bouton retour d'Android ---------- */
  try {
    var CapApp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
    if (CapApp && CapApp.addListener) {
      CapApp.addListener('backButton', function () {
        if (view === 'quiz') { if (sess.confirm) { sess.confirm = false; sess.focus = 'stem'; render(); } else { sess.confirm = true; render(); window.scrollTo(0, 0); } }
        else if (view === 'premium' || view === 'result' || view === 'legal') goHome();
        else CapApp.exitApp();
      });
    }
  } catch (err) {}

  /* ---------- Écran de lancement ---------- */
  (function () {
    var sp = document.createElement('div');
    sp.className = 'splash';
    sp.setAttribute('role', 'img');
    sp.setAttribute('aria-label', 'Easy Code');
    sp.setAttribute('translate', 'no');
    sp.innerHTML = '<p class="logo" aria-hidden="true"><span>EASY</span><span>C' + WHEEL + 'DE</span></p><p class="splash-s" aria-hidden="true">Voiture · Moto</p>';
    document.body.appendChild(sp);
    var done = false;
    function close() {
      if (done) return;
      done = true;
      sp.classList.add('out');
      if (view === 'home') anim('rise');
      setTimeout(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 550);
    }
    sp.addEventListener('click', close);
    setTimeout(close, 2100);
  })();
})();
</script>

</body></html>
