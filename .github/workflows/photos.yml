name: renov3d-photos
on: {push: {branches: [renov3d-photos], paths: ['tools/**','.github/**']}}
permissions: {contents: write}
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests pillow
      - run: mkdir -p ph && python tools/ph_list.py
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add ph && git commit -m "photos produits" && git push
