name: renov3d-to3d
on: {push: {branches: [renov3d-photos], paths: ['tools/to3d.py','tools/in3d/**','.github/workflows/to3d.yml']}}
permissions: {contents: write}
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install gradio_client pillow
      - run: python tools/to3d.py 2>&1 | tee tools/to3d.log
        continue-on-error: true
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A m3d tools/to3d.log && git commit -m "modeles 3d" && git push || true
